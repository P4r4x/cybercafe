name: cybercafe

services:

  postgres:
    image: postgres:16
    container_name: cybercafe-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    volumes:
      - ../assets/db:/var/lib/postgresql/data
    ports:
      - "15432:5432"

  redis:
    image: redis:7
    container_name: cybercafe-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --aclfile /usr/local/etc/redis/users.acl
    volumes:
      - ../assets/redis:/data
      - ./redis/users.acl:/usr/local/etc/redis/users.acl
    ports:
      - "16379:6379"